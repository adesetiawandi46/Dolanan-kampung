<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dolanan Kampung – Permainan Tradisional</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1b0b3a;--bg2:#3a0ca3;--pink:#ff3cac;--cyan:#2de2e6;--yel:#ffe45e;--card:rgba(255,255,255,.09);--tx:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Fredoka,system-ui,sans-serif;color:var(--tx)}
body{background:radial-gradient(circle at 20% 0,#7b2ff7 0,transparent 45%),radial-gradient(circle at 90% 100%,#ff3cac55 0,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;padding:env(safe-area-inset-top) 14px 24px}
.wrap{max-width:480px;margin:0 auto;padding-top:18px;text-align:center}
h1{font-size:2.3rem;margin:.2em 0;line-height:1;background:linear-gradient(90deg,var(--yel),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.8;margin-bottom:16px}
input{width:100%;padding:12px 16px;border-radius:14px;border:2px solid #fff3;background:#0004;color:#fff;font:inherit;text-align:center;margin-bottom:14px}
.card{background:var(--card);border:2px solid #fff2;border-radius:22px;padding:16px;margin:12px 0;backdrop-filter:blur(8px);text-align:left}
.card h2{margin:0 0 4px;font-size:1.4rem}
.card p{margin:0 0 10px;opacity:.85;font-size:.95rem}
.btn{display:inline-block;border:0;border-radius:16px;padding:12px 22px;font:700 1.05rem Fredoka,sans-serif;color:#1b0b3a;background:linear-gradient(90deg,var(--yel),#ffb347);box-shadow:0 5px 0 #b57a00;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b57a00}
.btn.pk{background:linear-gradient(90deg,var(--pink),#ff7ac6);box-shadow:0 5px 0 #a01670;color:#fff}
.btn.cy{background:linear-gradient(90deg,var(--cyan),#7df9ff);box-shadow:0 5px 0 #0f8f93}
.btn.big{width:100%;font-size:1.3rem;padding:16px}
.hud{display:flex;justify-content:space-between;gap:6px;margin-bottom:10px}
.hud span{flex:1;background:var(--card);border-radius:12px;padding:6px;font-weight:600;font-size:.9rem}
.board{display:flex;flex-direction:column-reverse;gap:6px;margin:10px auto;width:150px}
.box{height:54px;border-radius:12px;border:3px solid #fff5;background:#ffffff14;display:flex;align-items:center;justify-content:center;font-size:1.6rem;position:relative}
.box b{position:absolute;left:8px;top:2px;font-size:.8rem;opacity:.6}
.box.cur{background:#2de2e633;border-color:var(--cyan);box-shadow:0 0 18px var(--cyan)}
.box.stone{background:#ff3cac33;border-color:var(--pink)}
.bar{position:relative;height:30px;border-radius:15px;background:#0005;overflow:hidden;margin:12px 0;border:2px solid #fff3}
.zone{position:absolute;top:0;bottom:0;background:linear-gradient(#5cff9d,#1fbf6b);opacity:.9}
.mk{position:absolute;top:0;bottom:0;width:8px;background:#fff;box-shadow:0 0 10px #fff;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.cell{aspect-ratio:1;border-radius:10px;background:#ffffff12;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.cell.f{background:#ffe45e33}
.cell.p{background:#2de2e633}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:8px}
.pad .btn{padding:10px;font-size:1.3rem}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .35s}
@keyframes pp{50%{transform:scale(1.15)}}
ol{padding-left:22px;margin:6px 0;text-align:left}
.msg{min-height:24px;font-weight:600;color:var(--yel)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ck{display:grid;grid-template-columns:50px repeat(7,1fr) 50px;grid-template-rows:1fr 1fr;gap:5px;margin:10px 0;background:#0004;padding:8px;border-radius:20px;border:2px solid #fff3}
.hole{aspect-ratio:1;border-radius:50%;border:2px solid #fff4;background:radial-gradient(circle at 35% 30%,#ffffff30,#0006);color:#fff;font:700 1rem Fredoka,sans-serif;padding:0}
.hole.me:not(:disabled){border-color:var(--cyan);box-shadow:0 0 12px var(--cyan);cursor:pointer}
.store{grid-row:span 2;border-radius:25px;background:#ff3cac33;border:2px solid var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 1.5rem Fredoka,sans-serif}
.store.me{background:#2de2e633;border-color:var(--cyan)}.store small{font-size:.55rem;opacity:.7}

/* ===== TEMA KAMPUNG: sawah, sore hari, tanah, kayu ===== */
:root{--bg1:#ffb347;--bg2:#7bc96f;--pink:#d94f30;--cyan:#2f9e6b;--yel:#ffd23f;--card:rgba(255,248,225,.94);--tx:#3b2412}
body{background:radial-gradient(circle at 82% 7%,#fff7c2 0,#ffe08a 6%,transparent 17%),linear-gradient(#ffcf8b 0,#ff9f6b 30%,#9ad27a 64%,#4f9a4a 100%) fixed;color:var(--tx)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:10px;z-index:5;background:repeating-linear-gradient(90deg,#b5261e 0 14px,#ffd23f 14px 28px,#2f7d3a 28px 42px)}
body::after{content:"🌾🌴🛖🌾🐄🌾🌴🌾🐓🌾";position:fixed;bottom:0;left:0;right:0;z-index:-1;font-size:2rem;text-align:center;letter-spacing:8px;opacity:.6;white-space:nowrap;overflow:hidden;pointer-events:none}
h1{background:none;-webkit-background-clip:initial;background-clip:initial;color:#b5261e;text-shadow:2px 2px 0 #ffd23f,4px 4px 0 #6b3a1e;letter-spacing:1px}
.sub{opacity:1;color:#4a2c14;font-weight:600}
input{background:#fff8e1;color:#3b2412;border:3px solid #8a5a2b}
.card{border:3px solid #8a5a2b;box-shadow:0 5px 0 #8a5a2b;backdrop-filter:none}.card p{opacity:1}
.btn{background:linear-gradient(#ffd23f,#f5a623);box-shadow:0 5px 0 #a36a12;color:#3b2412}
.btn.pk{background:linear-gradient(#ef6a4a,#c93a22);box-shadow:0 5px 0 #8c2412;color:#fff}
.btn.cy{background:linear-gradient(#5fc98a,#2f9e6b);box-shadow:0 5px 0 #1c6b45;color:#fff}
.btn:active{box-shadow:0 1px 0 #0003}
.hud span{background:#fff8e1;border:2px solid #8a5a2b}
.msg{color:#8c2412}
.board{background:#b97a45;padding:8px;border-radius:14px;border:3px solid #6b3a1e;box-shadow:inset 0 0 20px #0004}
.box{border-color:#fff8e1;background:#c98b4e;color:#fff8e1}.box.cur{background:#ffd23f88;border-color:#ffd23f;box-shadow:0 0 14px #ffd23f}.box.stone{background:#d94f3066;border-color:#ffd23f}
.bar{background:#6b3a1e;border-color:#3b2412}.mk{background:#fff8e1;box-shadow:0 0 10px #fff}
.grid{background:#7a4a24;padding:6px;border-radius:14px;border:3px solid #4a2c14;color:#fff}.cell{background:#9b6335}.cell.f{background:#ffd23f99}.cell.p{background:#5fc98a99}
.ck{background:#8a5a2b;border-color:#4a2c14}.hole{background:radial-gradient(circle at 35% 30%,#5a361a,#2f1b0c);border-color:#d9a066;color:#fff8e1}
.hole.me:not(:disabled){border-color:#ffd23f;box-shadow:0 0 12px #ffd23f}.store{background:#5a361a;border-color:#d94f30;color:#fff8e1}.store.me{background:#5a361a;border-color:#5fc98a}
#mute,#music,#nx{position:fixed;top:16px;right:12px;z-index:6;width:42px;height:42px;border-radius:50%;border:3px solid #8a5a2b;background:#fff8e1;font-size:1.2rem;cursor:pointer;box-shadow:0 3px 0 #8a5a2b;padding:0}
#music{right:62px}#nx{right:112px}.wrap{padding-top:64px}
#toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:7;background:#fff8e1;border:3px solid #8a5a2b;border-radius:14px;padding:6px 14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;font-size:.9rem}
body{background:var(--scene) center bottom/cover no-repeat fixed,#ff9f6b}
body::after{content:none}
.kid{aspect-ratio:40/64;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.box .kid{height:50px}.cell .kid{width:64%;height:auto}.hero .kid{height:84px}
.kid{transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes hop{0%{transform:none}30%{transform:translateY(-14px) scale(.92,1.1)}60%{transform:translateY(0) scale(1.1,.88)}100%{transform:none}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-16px) rotate(7deg)}}
@keyframes run{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-2px)}}
.hero .kid{animation:bob 1.2s ease-in-out infinite}.hero .kid:nth-child(2){animation-delay:.3s}.hero .kid:nth-child(3){animation-delay:.6s}.hero .kid:nth-child(4){animation-delay:.9s}
.hero.dance .kid{animation:dance .5s ease-in-out infinite}
.box.cur .kid,.cell.p .kid{animation:hop .35s ease-out}
.cell:not(.p) .kid{animation:run .35s ease-in-out infinite}
.av{background:none;border:3px solid transparent;border-radius:14px;padding:2px 3px;cursor:pointer}.av.on{background:#fff8e1cc;border-color:#d94f30}.pick .kid{height:58px}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;pointer-events:none;animation:cf 2.6s ease-in forwards}
@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(720deg)}}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.cloud{position:absolute;font-size:64px;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
.bird{position:absolute;width:26px;animation:fly linear infinite}.bird svg{display:block;animation:flap .4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes fly{from{transform:translateX(-10vw)}to{transform:translateX(115vw) translateY(-40px)}}
@keyframes flap{50%{transform:scaleY(.4)}}
.kite{position:absolute;right:8%;top:13%;font-size:38px;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(12deg) translateY(10px)}}
@media (prefers-reduced-motion:reduce){.cloud,.bird,.bird svg,.kite,.cf,.kid{animation:none!important}}
</style>
</head>
<body>
<button id="nx" aria-label="Lagu berikutnya">⏭</button><button id="music" aria-label="Musik">🎵</button><button id="mute" aria-label="Suara">🔊</button><div id="toast"></div>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ====== ISI DENGAN KUNCI SUPABASE KAMU (kosongkan = leaderboard lokal) ====== */
const SB_URL = "";
const SB_KEY = "";
/* =========================================================================== */

const $ = s => document.querySelector(s), app = $("#app");
let sb = null;
try { if (SB_URL && SB_KEY && window.supabase) sb = supabase.createClient(SB_URL, SB_KEY); } catch (e) {}
const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
};
/* ---------- SUARA (disintesis WebAudio, tanpa file) ---------- */
let AC = null, muted = ls.get("mute", false);
const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)() } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); return AC };
function tone(f, d = .2, type = "sine", v = .2, t0 = 0, slide = 0) {
  if (muted) return; const a = ac(); if (!a) return; const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
const PEN = [523, 587, 698, 784, 880, 1047];
const bell = (f, d = .5, v = .2, t0 = 0) => { tone(f, d, "sine", v, t0); tone(f * 2.76, d * .5, "sine", v * .35, t0) };
const sfx = {
  click: () => tone(650, .05, "square", .06),
  hop: n => bell(PEN[Math.abs(n) % 5], .35, .2),
  up: () => [0, 1, 3, 5].forEach((k, i) => bell(PEN[k], .5, .2, i * .1)),
  win: () => [0, 1, 2, 3, 4, 5].forEach((k, i) => bell(PEN[k], .7, .22, i * .12)),
  lose: () => { sfx.knock(); tone(220, .6, "triangle", .2, .3, -120) },
  knock: () => { tone(190, .2, "triangle", .4, 0, -70); tone(150, .22, "triangle", .35, .13, -60) },
  step: () => tone(300, .05, "triangle", .1, 0, -100),
  seed: () => tone(700 + Math.random() * 250, .06, "triangle", .15, 0, -300),
  capture: () => { bell(784, .4, .22); bell(1047, .5, .2, .09) },
  flick: () => tone(260, .14, "sawtooth", .08, 0, 600),
  clack: k => { tone(1500 + Math.random() * 500, .05, "sine", .06 + .12 * k); tone(2400, .03, "triangle", .05 * k) },
  jump: () => tone(380, .16, "sine", .14, 0, 420)
};
const mb = $("#mute"); mb.textContent = muted ? "🔇" : "🔊";
mb.onclick = () => { muted = !muted; ls.set("mute", muted); mb.textContent = muted ? "🔇" : "🔊"; if (!muted) { ac(); sfx.click(); musicStart() } else musicStop(); };
/* ---------- LAGU DOLANAN (instrumental gamelan, disintesis) ---------- */
/* Tiap angka = indeks nada pentatonik (0=do rendah ... 5=do tinggi), "." = jeda. Silakan edit nadanya! */
const PN = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880];
const SONGS = [
  { n: "Cublak-Cublak Suweng (Jawa)", bpm: 160, m: "2 2 2 2 3 3 2 . 3 3 3 3 4 4 3 . 4 4 3 3 2 2 1 . 2 3 2 1 0 0 0 ." },
  { n: "Gundul-Gundul Pacul (Jawa)", bpm: 140, m: "4 4 4 3 2 . 3 . 4 4 4 3 2 . 3 . 2 2 3 2 1 . 0 . 1 1 2 1 0 . 0 ." },
  { n: "Lir-Ilir (Jawa)", bpm: 120, m: "2 4 5 4 2 . 3 . 2 4 5 4 2 . 1 . 3 5 6 5 3 . 4 . 2 3 4 3 1 . 0 ." },
  { n: "Burung Kakak Tua (Maluku)", bpm: 150, m: "5 5 5 6 5 . 3 . 4 4 4 3 2 . . . 5 5 5 6 5 . 3 . 4 3 2 1 0 . . ." },
  { n: "Ampar-Ampar Pisang (Kalsel)", bpm: 150, m: "3 3 4 4 3 . 2 . 3 3 4 4 3 . 2 . 4 4 5 4 3 . 2 . 1 2 3 2 0 . . ." },
  { n: "Soleram (Riau)", bpm: 130, m: "2 3 4 4 3 . 2 . 3 4 5 5 4 . 3 . 4 4 3 2 1 . 0 . 2 2 3 2 0 . . ." },
  { n: "Pok Ame-Ame (Betawi)", bpm: 170, m: "4 4 5 4 3 . 3 . 4 4 5 4 3 . 3 . 5 5 4 3 2 . 2 . 3 3 2 1 0 . . ." },
  { n: "Manuk Dadali (Sunda)", bpm: 150, m: "0 2 3 4 5 . 4 . 3 4 5 6 5 . 4 . 3 2 3 4 3 . 2 . 3 2 1 2 0 . . ." },
  { n: "Es Lilin (Sunda)", bpm: 100, m: "3 . 4 . 5 . 4 3 2 . 3 . 4 . 3 2 1 . 2 . 3 . 2 1 0 . . . 0 . . ." }
];
let song = Math.min(ls.get("song", 0), SONGS.length - 1), music = ls.get("music", true), mi = 0, loops = 0, nextT = 0, mt = null, tt;
function toast(t) { const e = $("#toast"); e.textContent = t; e.style.opacity = 1; clearTimeout(tt); tt = setTimeout(() => e.style.opacity = 0, 2200) }
/* File rekaman (opsional): taruh mp3 di assets/music/<judul-lagu>.mp3, otomatis dipakai menggantikan versi sintesis */
const au = new Audio(); au.volume = .55; let pf = false;
SONGS.forEach(S => {
  S.f = "assets/music/" + S.n.split(" (")[0].toLowerCase().replace(/[^a-z]+/g, "-") + ".mp3";
  fetch(S.f, { method: "HEAD" }).then(r => { S.ok = r.ok && /audio|mpeg|ogg/.test(r.headers.get("content-type") || "") }).catch(() => {});
});
function nextSong() { song = (song + 1) % SONGS.length; mi = 0; loops = 0; ls.set("song", song); toast("🎶 " + SONGS[song].n); musicStop(); musicStart() }
au.onended = nextSong;
/* Aransemen gamelan: bonang + saron (melodi & bass), kendang (dung-dang-tak), kempul, dan gong */
function sched() {
  const a = AC; if (!a) return; const S = SONGS[song], d = 60 / S.bpm, nt = S.m.split(" ");
  while (nextT < a.currentTime + .3) {
    const k = nt[mi % nt.length], rel = Math.max(0, nextT - a.currentTime), m8 = mi % 8, m16 = mi % 16;
    if (k !== ".") { bell(PN[+k], .55, .09, rel); tone(PN[+k] * 2, .18, "triangle", .02, rel); if (mi % 2 === 0) tone(PN[+k] / 2, d * 1.8, "triangle", .1, rel) }
    if (m8 === 0 || m8 === 4) tone(150, .2, "sine", .24, rel, -95);
    else if (m8 === 2 || m8 === 6) tone(300, .1, "triangle", .13, rel, -140);
    else tone(2200, .035, "square", .025, rel);
    if (m16 === 8) tone(220, 1, "sine", .1, rel);
    if (m16 === 0) { tone(110, 1.8, "sine", .16, rel); tone(165, 1.3, "sine", .06, rel) }
    mi++; nextT += d;
    if (mi % nt.length === 0 && ++loops >= 2) { nextSong(); break }
  }
}
function musicStart() {
  if (!music || muted) return; const S = SONGS[song];
  if (S.ok) { if (pf) return; pf = true; au.src = S.f; au.play().catch(() => { pf = false }); return }
  if (mt) return; const a = ac(); if (!a) return; nextT = a.currentTime + .1; mt = setInterval(sched, 100);
}
function musicStop() { clearInterval(mt); mt = null; au.pause(); pf = false }
const mub = $("#music"); mub.textContent = music ? "🎵" : "🔕"; mub.style.opacity = music ? 1 : .6;
mub.onclick = () => { music = !music; ls.set("music", music); mub.textContent = music ? "🎵" : "🔕"; mub.style.opacity = music ? 1 : .6; if (music) { musicStart(); toast("🎶 " + SONGS[song].n) } else musicStop() };
$("#nx").onclick = () => { song = (song + 1) % SONGS.length; mi = 0; loops = 0; ls.set("song", song); toast("🎶 " + SONGS[song].n); if (!music) mub.onclick(); else { musicStop(); musicStart() } };
document.addEventListener("visibilitychange", () => document.hidden ? musicStop() : musicStart());
addEventListener("pointerdown", e => { ac(); musicStart(); if (e.target.closest && e.target.closest(".btn:not(#jp):not(#hop)")) sfx.click() }, true);

let stop = () => {};
let nick = ls.get("nick", "");

async function saveScore(game, score) {
  const name = nick || "Anonim";
  if (sb) { try { const { error } = await sb.from("scores").insert({ name, game, score }); if (!error) return } catch (e) {} }
  const all = ls.get("scores", []); all.push({ name, game, score }); ls.set("scores", all);
}
async function getBoard(game) {
  if (sb) { try { const { data, error } = await sb.from("scores").select("name,score").eq("game", game).order("score", { ascending: false }).limit(5); if (!error && data) return data } catch (e) {} }
  return ls.get("scores", []).filter(s => s.game === game).sort((a, b) => b.score - a.score).slice(0, 5);
}

function menu() {
  stop();
  app.innerHTML = `
  <div class="hero pick" style="display:flex;justify-content:center;align-items:flex-end;gap:4px">${Object.keys(KS).map(n => `<button class="av ${n === avatar ? "on" : ""}" data-n="${n}" onclick="pickAv('${n}')">${kidTag(n)}</button>`).join("")}</div><div style="font-size:.8rem;font-weight:600;color:#4a2c14">Ketuk untuk pilih karakter kamu</div><h1>DOLANAN KAMPUNG</h1>
  <div class="sub">Hayu ulin, ayo dolanan! Kayak sore-sore di kampung, tapi versi game 🌾</div>
  <input id="nick" maxlength="14" placeholder="Nama panggilanmu, Kang/Teh…" value="${nick}">
  <div class="card"><h2>🦶 Engklek (Sondah)</h2><p>Lempar gaco, loncat satu kaki. Jangan sampai nginjak garis ya!</p><button class="btn pk" onclick="go('engklek')">MAIN</button></div>
  <div class="card"><h2>🏰 Benteng</h2><p>Rebut benteng lawan di ujung lapangan, awas ketangkep penjaga!</p><button class="btn cy" onclick="go('benteng')">MAIN</button></div>
  <div class="card"><h2>🥜 Congklak</h2><p>Sebar biji sawo, tembak lubang lawan. Si Mbah AI-nya licik lho!</p><button class="btn" onclick="go('congklak')">MAIN</button></div>
  <div class="card"><h2>🔮 Gundu (Kelereng)</h2><p>Sentil kelereng keluar lingkaran. Menang? Dapet sekantong!</p><button class="btn pk" onclick="go('gundu')">MAIN</button></div>
  <div class="card"><h2>🪢 Lompat Tali</h2><p>Loncat pas karet lewat. Makin lama makin ngebut!</p><button class="btn cy" onclick="go('tali')">MAIN</button></div>
  <div class="card"><h2>🐱 Ucing Sumput</h2><p>Ucing ngitung, kamu ngumpet! Sampai ke tiang 🏠 tanpa ketahuan ya.</p><button class="btn pk" onclick="go('sumput')">MAIN</button></div>

function congklak() {

  app.innerHTML = `<h1>CONGKLAK</h1>

    for (let k = 0; k < 7; k++) h += `<button class="hole me" data-i="${k}" ${busy || over || !b[k] ? "disabled" : ""} style="grid-area:2/${k + 2}">${b[k]}</button>`;

  }
  async function play(p, h) {

}

/* ---------------- KONTROL GRID (dipakai Ucing Sumput) ---------------- */
const PAD = `<div class="pad"><span></span><button class="btn cy" data-d="0,-1">⬆️</button><span></span><button class="btn cy" data-d="-1,0">⬅️</button><button class="btn cy" data-d="0,1">⬇️</button><button class="btn cy" data-d="1,0">➡️</button></div>`;
function ctl(move, sel) {
  const keys = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
  const key = e => { const k = keys[e.key]; if (k) { e.preventDefault(); move(...k) } };
  addEventListener("keydown", key);
  document.querySelectorAll(".pad [data-d]").forEach(b => b.onpointerdown = () => move(...b.dataset.d.split(",").map(Number)));
  let sx, sy; const g = $(sel);
  g.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY }, { passive: true });
  g.addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return; Math.abs(dx) > Math.abs(dy) ? move(Math.sign(dx), 0) : move(0, Math.sign(dy)) });
  return () => removeEventListener("keydown", key);
}

/* ---------------- UCING SUMPUT ---------------- */
function sumput() {
  const N = 8, walls = [[2, 2], [5, 2], [2, 5], [5, 5]], base = { x: 3, y: 3 }, S0 = { x: 0, y: 7 }, U0 = { x: 6, y: 1 };
  let round = 1, lives = 3, score = 0, P, U, count, bush = [], chase = false, done = false;
  const rnd = n => Math.floor(Math.random() * n), isW = (x, y) => walls.some(w => w[0] === x && w[1] === y), D = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
  const hid = () => bush.some(b => b.x === P.x && b.y === P.y), sees = () => D(U, P) <= (hid() ? 1 : round >= 3 ? 3 : 2);
  app.innerHTML = `<h1>UCING SUMPUT</h1>
  <div class="hud"><span id="h1"></span><span id="h2"></span><span id="h3"></span></div>
  <div class="msg" id="ms"></div><div class="grid" id="gr" style="grid-template-columns:repeat(8,1fr)"></div>${PAD}
  <p class="sub" style="font-size:.85rem">Sembunyi di 🌿 biar ga kelihatan, terus lari ke tiang 🏠 (hong!)</p>
  <button class="btn" onclick="menu()" style="font-size:.85rem;padding:8px 14px">Pulang</button>`;
  const ms = t => $("#ms").textContent = t;
  function setup() {
    P = { ...S0 }; U = { ...U0 }; count = 6; bush = [];
    while (bush.length < 6) { const x = rnd(N), y = rnd(N); if (!isW(x, y) && !(x === 3 && y === 3) && !(x === 0 && y === 7) && !(x === 6 && y === 1) && !bush.some(b => b.x === x && b.y === y)) bush.push({ x, y }) }
    ms("Ucing ngitung 🙈 … buruan ngumpet!");
  }
  function draw() {
    let h = "";
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let c = isW(x, y) ? "🛖" : bush.some(b => b.x === x && b.y === y) ? "🌿" : x === 3 && y === 3 ? "🏠" : "";
      if (U.x === x && U.y === y) c = count > 0 ? "🙈" : chase ? "😾" : "🐱";
      if (P.x === x && P.y === y) c = hid() ? "🫣" : kidTag(avatar);
      h += `<div class="cell ${x === 3 && y === 3 ? "f" : ""} ${P.x === x && P.y === y ? "p" : ""}" style="font-size:1.2rem">${c}</div>`;
    }
    $("#gr").innerHTML = h; $("#h1").textContent = "Ronde " + round; $("#h2").textContent = "❤️".repeat(lives); $("#h3").textContent = count > 0 ? "🙈 " + count : "👀 ⭐" + score;
  }
  function step(toP) {
    const o = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(d => ({ x: U.x + d[0], y: U.y + d[1] })).filter(q => q.x >= 0 && q.y >= 0 && q.x < N && q.y < N && !isW(q.x, q.y));
    if (!o.length) return;
    U = toP ? o.sort((a, b) => Math.abs(a.x - P.x) + Math.abs(a.y - P.y) - Math.abs(b.x - P.x) - Math.abs(b.y - P.y))[0] : o[rnd(o.length)];
  }
  function move(dx, dy) {
    if (done) return; const nx = P.x + dx, ny = P.y + dy;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N || isW(nx, ny)) return;
    P = { x: nx, y: ny }; sfx.step();
    if (P.x === base.x && P.y === base.y) { score += 100 + round * 20 + count * 5; round++; sfx.up(); setup(); draw(); ms("HONG! Selamat nyampe tiang! 🎉"); return }
    if (count > 0) { count--; ms(count ? "Ucing ngitung 🙈 … " + count : "Ucing buka mata! 👀 Awas!"); draw(); return }
    chase = sees();
    if (Math.random() < Math.min(.95, .55 + round * .06 + (chase ? .2 : 0))) step(chase);
    chase = sees(); ms(chase ? "Ucing nyium-nyium kamu! 😾" : hid() ? "Aman, ngumpet bagus 🫣" : "Ucing lagi nyari-nyari…");
    if (D(U, P) <= 1 && chase) {
      lives--; sfx.knock(); ms("Ketahuan! Nah, kamu jadi ucing 😹");
      if (lives <= 0) { done = true; end("sumput", score, "YAAH, KETAHUAN! 😵"); return }
      P = { ...S0 }; U = { ...U0 }; count = 6;
    }
    draw();
  }
  const off = ctl(move, "#gr"); stop = () => { done = true; off() }; setup(); draw();
}

/* ---------------- EGRANG ---------------- */
function egrang() {

  const ms = t => $("#ms").textContent = t;

    if (inv > 0) { inv -= dt; th = w = 0 }

    for (let i = 0; i < 5; i++) { const x = ((i * 130 - sc * .6) % 650 + 650) % 650 - 80; c.font = "54px serif"; c.textAlign = "center"; c.fillText(i % 2 ? "🌴" : "🛖", x, 232) }
    c.fillStyle = "#6b8f3a"; c.fillRect(0, 250, 360, 50); c.fillStyle = "#4f7a2a"; for (let i = 0; i < 9; i++) c.fillRect(((i * 50 - sc) % 400 + 400) % 400 - 20, 262 + (i % 3) * 12, 30, 4);
    c.save(); c.translate(180, 250); c.rotate(th * .55); c.lineCap = "round"; c.strokeStyle = "#d9a441"; c.lineWidth = 8;
    const oL = -14 * Math.sin(Math.PI * lL / .2), oR = -14 * Math.sin(Math.PI * lR / .2);

    c.globalAlpha = inv > 0 ? .5 : 1; dimg(c, avatar, -26, -132 + (oL + oR) / 2, 52, 84); c.restore();
    const g = c.createLinearGradient(60, 0, 300, 0); g.addColorStop(0, "#e63946"); g.addColorStop(.3, "#ffd23f"); g.addColorStop(.5, "#5fc98a"); g.addColorStop(.7, "#ffd23f"); g.addColorStop(1, "#e63946");
    c.fillStyle = g; c.fillRect(60, 14, 240, 10); c.fillStyle = "#3b2412"; c.fillRect(180 + th * 120 - 3, 8, 6, 22);
    $("#h1").textContent = "📏 " + (steps * .6).toFixed(1) + " m"; $("#h2").textContent = "❤️".repeat(lives); $("#h3").textContent = "⭐ " + steps * 10;
